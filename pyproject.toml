[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-crw"
version = "0.4.0"
description = "LangChain integration for CRW — high-performance web scraping document loader"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "CRW Project", email = "hello@fastcrw.com" }]
keywords = ["langchain", "crw", "web-scraping", "document-loader", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # The loader implementation and the langchain-core constraint both come from
    # the SDK extra, so there is one place to keep current. 0.28.0 is the floor
    # verified end to end.
    #
    # The upper bound is <2.0.0, not <1.0.0, on purpose. A <1.0.0 cap would
    # recreate exactly the bug this package just shipped: the day crw 1.0 lands,
    # `pip install langchain-crw crw>=1.0` becomes unsatisfiable and nothing
    # notices. The opposite risk, crw 1.0 moving crw.integrations.langchain, is
    # caught within a week by the downstream-langchain-crw job in crw-opencore,
    # which installs the published package and asserts the re-export identity.
    # A caught import error beats a silent resolution deadlock.
    "crw[langchain]>=0.28.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/us/crw"
Documentation = "https://fastcrw.com"
Repository = "https://github.com/us/langchain-crw"
Issues = "https://github.com/us/langchain-crw/issues"

[tool.hatch.build.targets.wheel]
packages = ["langchain_crw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests that hit the real fastcrw.com API (require CRW_API_KEY)"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
